name: Build and Publish to Ansible Galaxy

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Ansible
        run: |
          pip install ansible-core

      - name: Extract version from release tag
        id: version
        run: |
          # Use tag name only when this run was triggered by a release (GITHUB_REF = refs/tags/...)
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW#v}"
            VERSION="${VERSION%-devel}"
          fi
          # Fallback: read from galaxy.yml (e.g. 1.0.4-devel -> 1.0.4)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^version:\s*' galaxy.yml | sed -E 's/^version:\s*//' | sed 's/-devel$//')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version. GITHUB_REF=$GITHUB_REF (use a tag like v1.0.4 when creating the release) or set version in galaxy.yml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update galaxy.yml with release version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" galaxy.yml
          echo "Updated galaxy.yml version to ${{ steps.version.outputs.version }}"
          grep "^version:" galaxy.yml

      - name: Build collection
        run: |
          ansible-galaxy collection build .

      - name: Publish to Ansible Galaxy
        run: |
          TARBALL="lennysh-aap_reports-${{ steps.version.outputs.version }}.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::Built tarball not found: $TARBALL"
            ls -la *.tar.gz 2>/dev/null || true
            exit 1
          fi
          ansible-galaxy collection publish "$TARBALL" --token "${{ secrets.ANSIBLE_GALAXY_API_KEY }}"

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-artifact
          path: lennysh-aap_reports-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30
