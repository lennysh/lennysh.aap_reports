---
# AAP 2.4 only: revoke temporary token
- name: Clear AAP token (controller)
  ansible.controller.token:
    existing_token: "{{ __aap_token_obj }}"
    state: absent
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ aap_token }}"
    validate_certs: "{{ aap_validate_certs }}"
  no_log: "{{ aap_dummy_populate_no_log | bool }}"
...
