---
# Create controller organizations (all versions)
- name: Create controller organizations
  ansible.controller.organization:
    name: "{{ item.name }}"
    state: present
    controller_host: "{{ aap_hostname | default(omit) }}"
    controller_username: "{{ aap_username | default(omit) }}"
    controller_password: "{{ aap_password | default(omit) }}"
    controller_oauthtoken: "{{ aap_token | default(omit) }}"
    validate_certs: "{{ aap_validate_certs }}"
  loop: "{{ aap_dummy.organizations }}"
  loop_control:
    label: "{{ item.name }}"
...
