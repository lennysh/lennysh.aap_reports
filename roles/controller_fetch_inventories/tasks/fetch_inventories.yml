---
# Fetch all inventories (paginated). Recursively includes self for next page.
# Dumps into controller_inventories (list).

- name: Fetch inventories page {{ controller_fetch_page | default(1) }}
  ansible.builtin.uri:
    url: "{{ aap_url }}{{ controller_api_base_path }}/inventories/?page={{ controller_fetch_page | default(1) }}&page_size={{ node_metrics_controller_page_size | default(200) }}"
    method: GET
    user: "{{ aap_username if (aap_token is not defined or aap_token | length == 0) else omit }}"
    password: "{{ aap_password if (aap_token is not defined or aap_token | length == 0) else omit }}"
    force_basic_auth: "{{ (aap_token is not defined or aap_token | length == 0) and (aap_username is defined and aap_username | length > 0) }}"
    headers: "{{ {'Authorization': 'Bearer ' ~ aap_token} if (aap_token is defined and aap_token | length > 0) else omit }}"
    validate_certs: "{{ aap_validate_certs | default(true) | bool }}"
    return_content: true
    status_code: [200]
  register: controller_inv_page

- name: Append inventories page to controller_inventories
  ansible.builtin.set_fact:
    controller_inventories: "{{ (controller_inventories | default([])) + (controller_inv_page.json.results | default([])) }}"

- name: Brief pause between API requests (inventories)
  ansible.builtin.pause:
    seconds: "{{ node_metrics_controller_request_delay | default(0.15) }}"
    prompt: ""
  when: (controller_inv_page.json.next | default('', true)) | length > 0

- name: Set next inventories page number
  ansible.builtin.set_fact:
    _controller_next_page: "{{ (controller_fetch_page | default(1)) | int + 1 }}"
  when: (controller_inv_page.json.next | default('', true)) | length > 0

- name: Fetch next inventories page
  ansible.builtin.include_tasks: fetch_inventories.yml
  vars:
    controller_fetch_page: "{{ _controller_next_page }}"
  when: (controller_inv_page.json.next | default('', true)) | length > 0
...
