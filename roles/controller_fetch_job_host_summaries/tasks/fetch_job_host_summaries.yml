---
# Fetch job_host_summaries for one job (paginated). Recursively includes self for next page.
# Merges into controller_job_host_summaries[job_id]. Expects current_job_id (and optionally controller_fetch_page).

- name: Fetch job host summaries for job {{ current_job_id }} page {{ controller_fetch_page | default(1) }}
  ansible.builtin.uri:
    url: "{{ aap_url }}{{ controller_api_base_path }}/jobs/{{ current_job_id }}/job_host_summaries/?page={{ controller_fetch_page | default(1) }}&page_size={{ node_metrics_controller_page_size | default(200) }}"
    method: GET
    user: "{{ aap_username if (aap_token is not defined or aap_token | length == 0) else omit }}"
    password: "{{ aap_password if (aap_token is not defined or aap_token | length == 0) else omit }}"
    force_basic_auth: "{{ (aap_token is not defined or aap_token | length == 0) and (aap_username is defined and aap_username | length > 0) }}"
    headers: "{{ {'Authorization': 'Bearer ' ~ aap_token} if (aap_token is defined and aap_token | length > 0) else omit }}"
    validate_certs: "{{ aap_validate_certs | default(true) | bool }}"
    return_content: true
    status_code: [200]
  register: controller_jh_page

- name: Merge job host summaries page into controller_job_host_summaries
  ansible.builtin.set_fact:
    controller_job_host_summaries: "{{ _jh_existing | combine({_jh_key: _jh_new_list}) }}"
  vars:
    _jh_existing: "{{ controller_job_host_summaries | default({}) }}"
    _jh_key: "{{ current_job_id | string }}"
    _jh_new_list: "{{ (_jh_existing[_jh_key] | default([])) + (controller_jh_page.json.results | default([])) }}"

- name: Brief pause between API requests (job host summaries)
  ansible.builtin.pause:
    seconds: "{{ node_metrics_controller_request_delay | default(0.15) }}"
    prompt: ""
  when: (controller_jh_page.json.next | default('', true)) | length > 0

- name: Set next job host summaries page and job id for recursive include
  ansible.builtin.set_fact:
    _controller_next_page: "{{ (controller_fetch_page | default(1)) | int + 1 }}"
    _controller_current_job_id: "{{ current_job_id }}"
  when: (controller_jh_page.json.next | default('', true)) | length > 0

- name: Fetch next job host summaries page
  ansible.builtin.include_tasks: fetch_job_host_summaries.yml
  vars:
    controller_fetch_page: "{{ _controller_next_page }}"
    current_job_id: "{{ _controller_current_job_id }}"
  when: (controller_jh_page.json.next | default('', true)) | length > 0
...
