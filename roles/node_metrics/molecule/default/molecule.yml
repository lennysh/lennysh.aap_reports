---
prerun: false
driver:
  name: podman
dependency:
  name: galaxy
  enabled: true
platforms:
  - name: instance
    image: registry.access.redhat.com/ubi9-init:latest
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    command: "/lib/systemd/systemd"
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: auto
        aap_url: "https://aap.example.com"
        aap_username: "admin"
        aap_password: "password"
        node_metrics_output_folder: "/tmp"
        node_metrics_output_formats:
          - markdown
verifier:
  name: ansible
  options:
    show-diff: true