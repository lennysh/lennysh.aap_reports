---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    report_node_metrics_output_folder: "/tmp"
    report_node_metrics_output_filename: "aap_node_metrics_report"
  tasks:
    - name: Check that report files were created
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ report_node_metrics_output_folder }}/{{ report_node_metrics_output_filename }}.md"
      register: report_node_metrics_report_files
      failed_when: false

    - name: Display report file status
      ansible.builtin.debug:
        msg: "Report file {{ item.item }} exists: {{ item.stat.exists }}"
      loop: "{{ report_node_metrics_report_files.results }}"
...
