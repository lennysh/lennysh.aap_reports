---
# Build node metrics from controller_* vars using build_node_metrics module. No API calls.
# Requires: controller_config, controller_organizations, controller_host_metrics,
#           controller_inventories, controller_inventory_hosts, aap_url.

- name: Build report_node_metrics_data from controller data
  lennysh.aap_reports.build_node_metrics:
    config: "{{ controller_config | default(omit) }}"
    organizations: "{{ controller_organizations | default([]) }}"
    host_metrics: "{{ controller_host_metrics | default([]) }}"
    inventories: "{{ controller_inventories | default([]) }}"
    inventory_hosts: "{{ controller_inventory_hosts | default({}) }}"
    aap_url: "{{ aap_url | default('') }}"
  register: _build_node_metrics_result

- name: Set report_node_metrics_data from build result
  ansible.builtin.set_fact:
    report_node_metrics_data:
      metrics: "{{ _build_node_metrics_result.metrics }}"
      organizations_count: "{{ _build_node_metrics_result.organizations_count }}"
      nodes_count: "{{ _build_node_metrics_result.nodes_count }}"
...
